version: 0.2

# Renovate programado sobre el repo `common` (CodeCommit): actualiza las versiones de terceros del
# BOM y deja ramas en el repo. CodeCommit no tiene soporte de PR en Renovate (no existe
# `platform: awsCodeCommit`), asi que el PR en cada ms lo abre el trigger por release de `common`
# (platform/scripts/bump-bom-version.py), no este build.
#
# Cero credenciales en el repo: el token de CodeArtifact y las credenciales de Git llegan por
# Secrets Manager como variables de entorno.

env:
  variables:
    RENOVATE_DETECT_HOST_RULES_FROM_ENV: "true"
    GIT_TERMINAL_PROMPT: "0"

phases:
  pre_build:
    commands:
      - 'echo "CODEARTIFACT_AUTH_TOKEN presente: ${CODEARTIFACT_AUTH_TOKEN:+si}"'
      - 'echo "CODEARTIFACT_URL: ${CODEARTIFACT_URL}"'
      # Credenciales de Git por HTTPS, en memoria: no se escriben en ~/.gitconfig ni en disco.
      - |
        cat > "$CODEBUILD_SRC_DIR/askpass.sh" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) echo "$GIT_USERNAME" ;;
          *) echo "$GIT_PASSWORD" ;;
        esac
        ASKPASS
      - 'chmod +x "$CODEBUILD_SRC_DIR/askpass.sh"'
      - 'export GIT_ASKPASS="$CODEBUILD_SRC_DIR/askpass.sh"'
      - git config --global user.name "renovate"
      - git config --global user.email "renovate@epc.local"
      - git config --global --add safe.directory "$CODEBUILD_SRC_DIR"
  build:
    commands:
      - renovate --platform=local --log-level=info
  finally:
    commands:
      - rm -f "$CODEBUILD_SRC_DIR/askpass.sh"