version: 0.2

# Buildspec compartido: compila fuera de Docker y construye la imagen del microservicio sobre
# la imagen base de runtime. El token de CodeArtifact se pide en `pre_build` con la identidad del
# build (ADR-0022), igual que en java-ci.yml.

env:
  variables:
    MAVEN_OPTS: "-Xmx3072m"

phases:
  install:
    runtime-versions:
      java: corretto17
  pre_build:
    commands:
      # Mismo settings.xml que java-ci.yml: sin el, un microservicio no resolveria common-bom.
      - |
        if [ -n "${CODEARTIFACT_URL:-}" ]; then
          CODEARTIFACT_AUTH_TOKEN="$(aws codeartifact get-authorization-token \
            --domain "${CODEARTIFACT_DOMAIN:-epc}" --query authorizationToken --output text)"
          test -n "$CODEARTIFACT_AUTH_TOKEN" || { echo "No se pudo obtener el token"; exit 1; }
          mkdir -p "${HOME}/.m2"
          cat > "${HOME}/.m2/settings.xml" <<SETTINGS
        <?xml version="1.0" encoding="UTF-8"?>
        <settings>
          <servers>
            <server>
              <id>codeartifact</id>
              <username>aws</username>
              <password>$CODEARTIFACT_AUTH_TOKEN</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>codeartifact</id>
              <repositories>
                <repository>
                  <id>codeartifact</id>
                  <url>${CODEARTIFACT_URL}</url>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <activeProfiles><activeProfile>codeartifact</activeProfile></activeProfiles>
        </settings>
        SETTINGS
          unset CODEARTIFACT_AUTH_TOKEN
        fi
  build:
    commands:
      - mvn -B -ntp compile dependency:copy-dependencies -DincludeScope=runtime -DskipTests
      - docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .
  post_build:
    commands:
      - docker images
  finally:
    commands:
      - rm -rf "${HOME}/.m2/settings.xml"

cache:
  paths:
    - "/root/.m2/**/*"