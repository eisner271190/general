version: 0.2

# Buildspec compartido de microservicios Java: valida con `mvn verify`.
# Referenciado por ARN de S3 (s3://epc-buildspecs/java-ci.yml), no copiado en cada microservicio.
#
# El token de CodeArtifact se pide aqui con la identidad del build (ADR-0022): no hay secreto
# en Terraform ni en Secrets Manager. El settings.xml que lo lleva es efimero.

env:
  variables:
    MAVEN_OPTS: "-Xmx3072m"

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - mvn -version
  pre_build:
    commands:
      - |
        if [ -n "${CODEARTIFACT_URL:-}" ]; then
          CODEARTIFACT_AUTH_TOKEN="$(aws codeartifact get-authorization-token \
            --domain "${CODEARTIFACT_DOMAIN:-epc}" --query authorizationToken --output text)"
          test -n "$CODEARTIFACT_AUTH_TOKEN" || { echo "No se pudo obtener el token"; exit 1; }
          mkdir -p "${HOME}/.m2"
          cat > "${HOME}/.m2/settings.xml" <<SETTINGS
        <?xml version="1.0" encoding="UTF-8"?>
        <settings>
          <servers>
            <server>
              <id>codeartifact</id>
              <username>aws</username>
              <password>$CODEARTIFACT_AUTH_TOKEN</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>codeartifact</id>
              <repositories>
                <repository>
                  <id>codeartifact</id>
                  <url>${CODEARTIFACT_URL}</url>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <activeProfiles><activeProfile>codeartifact</activeProfile></activeProfiles>
        </settings>
        SETTINGS
          unset CODEARTIFACT_AUTH_TOKEN
        else
          echo "CODEARTIFACT_URL no definida: se compila sin repositorio CodeArtifact"
        fi
  build:
    commands:
      - mvn -B -ntp verify
  post_build:
    commands:
      - mkdir -p "${CODEBUILD_SRC_DIR}/test-reports"
      - find . -type d -path '*/target/surefire-reports' -exec cp -r {} "${CODEBUILD_SRC_DIR}/test-reports/" \;
  finally:
    commands:
      # El token solo existió dentro del contenedor: no queda en disco.
      - rm -rf "${HOME}/.m2/settings.xml"

cache:
  paths:
    - "/root/.m2/**/*"